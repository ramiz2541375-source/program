<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>7. Sınıf Sınav Takvimi</title>
<style>
  :root {
    --bg: #f5f6f8;
    --card: #ffffff;
    --text: #1f2933;
    --muted: #6b7682;
    --line: #e6e8ec;
    --accent: #2f4a7a;
    --accent-soft: #e9eef7;
    --meb: #1f7a5a;
    --meb-soft: #e3f3ec;
    --sec: #8a5a14;
    --sec-soft: #fbf0dd;
    --today: #fff7e0;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14171c;
      --card: #1c2027;
      --text: #e6e9ee;
      --muted: #95a0ad;
      --line: #2b313a;
      --accent: #8fb0e8;
      --accent-soft: #232c3b;
      --meb: #6fd1a8;
      --meb-soft: #1d3029;
      --sec: #e8b866;
      --sec-soft: #33291a;
      --today: #2c2817;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    line-height: 1.45;
    padding: 32px 16px 48px;
  }
  .wrap { max-width: 760px; margin: 0 auto; }
  header { text-align: center; margin-bottom: 24px; }
  header .school {
    font-size: 13px;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--muted);
  }
  header h1 {
    margin: 6px 0 4px;
    font-size: 28px;
    font-weight: 700;
    color: var(--accent);
  }
  header p { margin: 0; color: var(--muted); font-size: 15px; }

  .legend {
    display: flex;
    justify-content: center;
    gap: 16px;
    flex-wrap: wrap;
    margin-bottom: 20px;
    font-size: 13px;
    color: var(--muted);
  }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }

  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 1px 2px rgba(0,0,0,.04), 0 6px 20px rgba(0,0,0,.04);
  }
  table { width: 100%; border-collapse: collapse; }
  thead th {
    text-align: left;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: .06em;
    text-transform: uppercase;
    color: var(--muted);
    padding: 14px 18px;
    border-bottom: 1px solid var(--line);
  }
  tbody td {
    padding: 13px 18px;
    border-bottom: 1px solid var(--line);
    vertical-align: middle;
    font-size: 15px;
  }
  tbody tr:last-child td { border-bottom: none; }
  tr.day-start td { border-top: 2px solid var(--line); }
  tbody tr:first-child td { border-top: none; }

  td.date { white-space: nowrap; width: 150px; }
  td.date .d { font-weight: 600; }
  td.date .w { display: block; font-size: 13px; color: var(--muted); }
  td.lesson { font-weight: 500; }
  td.time { white-space: nowrap; width: 90px; text-align: right; }
  thead th.time { text-align: right; }

  .period {
    display: inline-block;
    min-width: 62px;
    text-align: center;
    padding: 4px 10px;
    border-radius: 999px;
    background: var(--accent-soft);
    color: var(--accent);
    font-size: 13px;
    font-weight: 600;
  }
  .tag {
    display: inline-block;
    margin-left: 6px;
    padding: 2px 8px;
    border-radius: 6px;
    font-size: 11px;
    font-weight: 600;
    vertical-align: 2px;
    white-space: nowrap;
  }
  .tag.meb { background: var(--meb-soft); color: var(--meb); }
  .tag.sec { background: var(--sec-soft); color: var(--sec); }

  @media (min-width: 561px) {
    tbody tr:not(.day-start) td.date > * { visibility: hidden; }
  }

  tr.past td { opacity: .45; }
  tr.is-today td { background: var(--today); }

  footer {
    margin-top: 18px;
    text-align: center;
    font-size: 13px;
    color: var(--muted);
  }

  @media (max-width: 560px) {
    body { padding-top: 20px; }
    header h1 { font-size: 23px; }
    thead { display: none; }
    tbody td { padding: 10px 14px; font-size: 14px; }
    td.date { width: auto; }
    td.date .w { display: inline; margin-left: 4px; }
    td.date .w::before { content: "· "; }
    tbody tr { display: grid; grid-template-columns: 1fr auto; border-bottom: 1px solid var(--line); }
    tbody tr:last-child { border-bottom: none; }
    tbody td, tr.day-start td { border: none; }
    tbody tr td.date { grid-column: 1 / 2; padding-bottom: 0; }
    tbody tr td.time { grid-column: 2 / 3; grid-row: 1 / 3; align-self: center; }
    tbody tr td.lesson { grid-column: 1 / 2; padding-top: 4px; }
    tr.day-start { border-top: 2px solid var(--line); }
    tbody tr:first-child { border-top: none; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="school">Şehitler Ortaokulu · 2026–2027</div>
    <h1>7. Sınıf Sınav Takvimi</h1>
    <p>1. Dönem 1. Yazılı Sınavları</p>
  </header>

  <div class="legend">
    <span><span class="tag meb">MEB Ortak</span> MEB ortak sınavı</span>
    <span><span class="tag sec">Seçmeli</span> Yalnızca dersi seçenler</span>
  </div>

  <div class="card">
    <table>
      <thead>
        <tr>
          <th>Tarih</th>
          <th>Ders</th>
          <th class="time">Saat</th>
        </tr>
      </thead>
      <tbody id="exams"></tbody>
    </table>
  </div>

  <footer>Geçmiş sınavlar soluk, bugünkü sınavlar vurgulu görünür.</footer>
</div>

<script>
  const exams = [
    ["2026-11-03", "Fen Bilimleri", "meb", "2. Ders"],
    ["2026-11-03", "Oyun ve Oyun Etkinlikleri", "sec", "4. Ders"],
    ["2026-11-04", "Matematik ve Bilim Uygulamaları", "sec", "2. Ders"],
    ["2026-11-05", "Matematik", "meb", "2. Ders"],
    ["2026-11-05", "Beden Eğitimi", "", "4. Ders"],
    ["2026-11-06", "Sosyal Bilgiler", "meb", "2. Ders"],
    ["2026-11-06", "Ahlak ve Vatandaşlık", "sec", "4. Ders"],
    ["2026-11-09", "Temel Dini Bilgiler", "sec", "2. Ders"],
    ["2026-11-09", "Peygamberimizin Hayatı", "sec", "4. Ders"],
    ["2026-11-10", "Türkçe", "meb", "5. Ders"],
    ["2026-11-10", "Müzik", "", "7. Ders"],
    ["2026-11-11", "Teknoloji ve Tasarım", "", "2. Ders"],
    ["2026-11-11", "Spor", "sec", "4. Ders"],
    ["2026-11-12", "Yabancı Dil", "meb", "2. Ders"],
    ["2026-11-12", "Hukuk ve Adalet", "sec", "4. Ders"],
    ["2026-11-13", "Din Kültürü ve Ahlak Bilgisi", "meb", "2. Ders"],
    ["2026-11-13", "Görsel Sanatlar", "", "4. Ders"]
  ];

  const days = ["Pazar", "Pazartesi", "Salı", "Çarşamba", "Perşembe", "Cuma", "Cumartesi"];
  const months = ["Ocak", "Şubat", "Mart", "Nisan", "Mayıs", "Haziran", "Temmuz", "Ağustos", "Eylül", "Ekim", "Kasım", "Aralık"];
  const tags = { meb: '<span class="tag meb">MEB Ortak</span>', sec: '<span class="tag sec">Seçmeli</span>' };

  const now = new Date();
  const todayKey = [now.getFullYear(), String(now.getMonth() + 1).padStart(2, "0"), String(now.getDate()).padStart(2, "0")].join("-");

  const tbody = document.getElementById("exams");
  let prev = null;
  for (const [iso, lesson, tag, time] of exams) {
    const [y, m, d] = iso.split("-").map(Number);
    const date = new Date(y, m - 1, d);
    const tr = document.createElement("tr");
    if (iso !== prev) tr.className = "day-start";
    if (iso < todayKey) tr.classList.add("past");
    if (iso === todayKey) tr.classList.add("is-today");
    tr.innerHTML =
      `<td class="date"><span class="d">${d} ${months[m - 1]}</span><span class="w">${days[date.getDay()]}</span></td>` +
      `<td class="lesson">${lesson}${tags[tag] || ""}</td>` +
      `<td class="time"><span class="period">${time}</span></td>`;
    tbody.appendChild(tr);
    prev = iso;
  }
</script>
</body>
</html>
